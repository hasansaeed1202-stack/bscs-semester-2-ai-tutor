name = "bscs-semester-2-ai-tutor"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

[durable_objects]
bindings = [{ name = "LIMITER", class_name = "TutorLimiter" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TutorLimiter"]

[ai]
binding = "AI"

[vars]
TUTOR_ENABLED = "false"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
# Configure ALLOWED_ORIGINS and numeric budgets per environment.
# Store CLIENT_KEY_SECRET with `wrangler secret put`; never place it here.
